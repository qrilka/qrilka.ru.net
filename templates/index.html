<!doctype html>
<html lang="{{ config.default_language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ config.description }}">
  <title>{{ config.title }}</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
      color: #242824;
      background: #f7f6f2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    main { width: 100%; max-width: 44rem; }
    h1 {
      margin: 0 0 2rem;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 650;
      letter-spacing: -0.05em;
      line-height: 1.1;
    }
    nav { display: flex; flex-wrap: wrap; gap: 1rem; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.85rem 1.1rem;
      border: 1px solid #b9beb7;
      border-radius: 0.6rem;
      color: inherit;
      text-decoration: none;
    }
    a:hover { background: #e7ebe3; border-color: #52634d; }
    a:focus-visible { outline: 3px solid #52634d; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>{{ config.title }}</h1>
    {{ section.content | safe }}
    <nav aria-label="Social profiles">
      <a href="https://github.com/qrilka/">
        <img src="{{ get_url(path='icons/github.svg') }}" width="24" height="24" alt="">
        GitHub
      </a>
      <a href="https://www.linkedin.com/in/k-zaborsky/">
        <img src="{{ get_url(path='icons/linkedin.svg') }}" width="24" height="24" alt="">
        LinkedIn
      </a>
    </nav>
  </main>
</body>
</html>
